{% extends "baseAdmin.html" %}

{% block title %}Login Admin - Telkomedika{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-150px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
        
        <div class="text-center">
            <div class="mx-auto h-16 w-16 bg-red-50 text-tm-red rounded-full flex items-center justify-center text-2xl shadow-sm mb-4">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 class="mt-2 text-3xl font-extrabold text-gray-900 tracking-tight">Portal Admin</h2>
            <p class="mt-2 text-sm text-gray-600">
                Silakan masuk untuk mengelola sistem.
            </p>
        </div>

        <form class="mt-8 space-y-6" action="{{ url_for('auth.login_admin') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Administrator</label>
                    <div class="relative">
                        <input id="email" name="email" type="email" required 
                            class="appearance-none relative block w-full pl-10 px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-tm-cyan focus:border-tm-cyan focus:z-10 sm:text-sm transition ease-in-out duration-150" 
                            placeholder="admin@telkomedika.co.id">
                        
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input id="password" name="password" type="password" required 
                            class="appearance-none relative block w-full pl-10 px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-tm-cyan focus:border-tm-cyan focus:z-10 sm:text-sm transition ease-in-out duration-150" 
                            placeholder="••••••••">

                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>

                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                            <i class="fas fa-eye-slash" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-full text-white bg-tm-cyan hover:bg-cyan-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-tm-cyan transition transform hover:-translate-y-0.5 shadow-lg">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-sign-in-alt text-cyan-200 group-hover:text-white transition"></i>
                    </span>
                    Masuk ke Dashboard
                </button>
            </div>

            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login_pasien') }}" class="font-medium text-sm text-tm-red hover:text-red-700 transition">
                    <i class="fas fa-arrow-right mr-1"></i> Login sebagai Pasien
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        }
    }
</script>
{% endblock %}
