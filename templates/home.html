{% extends "base.html" %}

{% block title %}Homepage - Telkomedika{% endblock %}

{% block content %}
<div class="min-h-screen flex justify-center items-center">
  <div class="w-full px-8 py-20 bg-red-400 mx-auto rounded-full text-center">
    <div class="space-y-10">
      {% if current_user.is_authenticated %}
        <h1 class="text-5xl text-white">
          Anda berhasil Login!
        </h1>
        <p class="text-white">Selamat Datang, {{ current_user.nama }}</p>
        <p class="text-white">{{ current_user.email }}</p>
        <form action="{{ url_for('auth.logout') }}" method="#" class="flex justify-center items-center mt-6">
          <button
            class="group flex items-center justify-center w-32 h-11 bg-red-600 rounded-full cursor-pointer relative overflow-hidden transition-all duration-200 shadow-lg hover:w-40 hover:rounded-lg active:translate-x-1 active:translate-y-1"
          >
            <div
              class="flex items-center justify-center w-full transition-all duration-300 group-hover:justify-start group-hover:px-3"
            >
              <svg class="w-4 h-4" viewBox="0 0 512 512" fill="white">
                <path
                  d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"
                ></path>
              </svg>
            </div>
            <div
              class="absolute right-5 transform translate-x-full opacity-0 text-white text-lg font-semibold transition-all duration-300 group-hover:translate-x-0 group-hover:opacity-100"
            >
              Logout
            </div>
          </button>
        </form>

      {% else %}
        <div class="flex flex-col bg-[#193f80] w-64 p-4 rounded-3xl gap-4 mx-auto">
          <a 
            href="{{ url_for('auth.login_pasien') }}"
            class="bg-[#225bc3] hover:bg-[#185bd8] hover:scale-[1.065] hover:translate-y-[-7px] hover:rounded-[23px] hover:rounded-bl-none hover:rounded-br-none px-6 py-2 rounded-2xl transition-all text-center text-[#d8e5f9] hover:text-[#a8c1f0] font-medium cursor-pointer"
          >
            Login
          </a>
          <a
            href="{{ url_for('auth.register') }}"
            class="bg-[#5350c6] hover:bg-secondary-600 hover:scale-[1.065] hover:translate-y-[7px] hover:rounded-[23px] hover:rounded-tl-none hover:rounded-tr-none px-6 py-2 rounded-2xl transition-all text-center text-[#d8e5f9] hover:text-[#b3aaee] font-medium cursor-pointer"
          >
            Register
          </a>
        </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
