{% extends "layout_profile.html" %}

{% block content %}
<form action="{{ url_for('pasien.profile_updatepassword') }}" method="POST" class="bg-gray-100 rounded-3xl p-8 md:p-12 min-h-[600px] flex items-center justify-center">
    <div class="w-full max-w-lg space-y-6">
        <div>
            <label class="block text-sm font-medium mb-2 ml-1">Old Password</label>
            <input type="password" name="old-password" class="w-full px-6 py-3 rounded-full border border-gray-400 bg-white focus:outline-none focus:border-tm-red transition">
        </div>
        <button type="submit" class="w-full bg-tm-red text-white font-bold py-3 rounded-full shadow-lg hover:bg-red-700 transition mt-4">
            Ubah
        </button>
    </div>
</form>
{% endblock %}
